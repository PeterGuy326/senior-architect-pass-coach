<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="referrer" content="no-referrer">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    >
    <title>连接本机 Agent · 架构过线私塾</title>
    <style>
      :root { color: #17213f; background: #f3eddf; font: 16px/1.7 system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { box-sizing: border-box; width: min(440px, calc(100% - 32px)); padding: 32px; background: #fffdf7; border: 1px solid #cdbf9f; box-shadow: 0 18px 60px #17213f24; }
      .seal { display: grid; place-items: center; width: 52px; height: 52px; color: #fff; background: #a33b2e; font: 700 28px serif; }
      h1 { margin: 20px 0 8px; font: 700 28px/1.25 serif; }
      p { margin: 10px 0; }
      .boundary { padding: 12px 14px; background: #f7f1e6; border-left: 3px solid #a33b2e; }
      button { width: 100%; margin-top: 20px; padding: 13px 18px; border: 0; color: #fff; background: #17213f; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .6; }
      #pair-status[data-state="error"] { color: #9b2f26; }
    </style>
    <script type="module" src="./src/pair.mjs"></script>
  </head>
  <body>
    <main>
      <div class="seal" aria-hidden="true">架</div>
      <h1>允许网页连接本机 Agent？</h1>
      <p>你正在把本机 Digital Employee Runtime 授权给“架构过线私塾”公开页面。</p>
      <p class="boundary">
        授权只在本次页面内存中有效。网页可以读取可用 Agent 并请求讲解，但不能让模型直接修改你的学习进度。
      </p>
      <button id="pair-approve" type="button">允许并返回私教页面</button>
      <p id="pair-status" role="status" aria-live="polite">等待你的确认。</p>
    </main>
  </body>
</html>
