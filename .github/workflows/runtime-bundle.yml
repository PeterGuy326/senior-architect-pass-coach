name: Local Agent Runtime bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "runtime-v*"

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            platform: darwin
            arch: arm64
            archive: Senior-Architect-Pass-Coach-macOS-arm64.zip
          - name: macOS Intel
            runner: macos-15-intel
            platform: darwin
            arch: x64
            archive: Senior-Architect-Pass-Coach-macOS-x64.zip
          - name: Linux x64 (glibc 2.28+)
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            archive: senior-architect-pass-coach-linux-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version and commit
        if: startsWith(github.ref, 'refs/tags/runtime-v')
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$GITHUB_REF_NAME" in
            "runtime-v${version}"|"runtime-v${version}-"*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2; exit 1 ;;
          esac
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Install locked production dependencies
        run: npm ci --omit=dev

      - name: Verify bundle architecture
        run: test "$(node -p 'process.arch')" = "${{ matrix.arch }}"

      - name: Verify the runtime and bundled Web client source
        run: npm test

      - name: Build self-contained runtime folder
        run: >-
          node scripts/package-local-runtime.mjs
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --node "$(command -v node)"
          --out dist

      - name: Smoke-test the packaged runtime
        run: node scripts/smoke-local-runtime-bundle.mjs --platform "${{ matrix.platform }}"

      - name: Apply ad-hoc macOS integrity signature
        if: matrix.platform == 'darwin'
        run: |
          codesign --force --deep --sign - "dist/Senior Architect Pass Coach.app"
          codesign --verify --deep --strict "dist/Senior Architect Pass Coach.app"

      - name: Archive macOS app
        if: matrix.platform == 'darwin'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Senior Architect Pass Coach.app" "${{ matrix.archive }}"

      - name: Archive Linux bundle
        if: matrix.platform == 'linux'
        run: tar -C dist -czf "${{ matrix.archive }}" "senior-architect-pass-coach-linux-${{ matrix.arch }}"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified bundles
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release-assets/*/*)
          test "${#files[@]}" -gt 0
          : > SHA256SUMS
          for file in "${files[@]}"; do
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$(basename "$file")" >> SHA256SUMS
          done
          files+=(SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "架构过线私教 Local Agent Runtime $GITHUB_REF_NAME" \
            --notes "无需 clone、npm install 或编译：下载对应系统压缩包，解压后直接打开；可用同页 SHA256SUMS 核对文件完整性。Linux 资产要求 x64 + glibc 2.28+，不适用于 Alpine/musl。当前 macOS 包为未 notarize 的开源预览版，ad-hoc 签名只用于完整性检查，不代表 Developer ID 或 Apple 背书；若 Finder 右键“打开”仍被拦，请先尝试启动一次，再到“系统设置 → 隐私与安全 → 仍要打开”。Agent CLI 与模型凭证不会打包，只有 Digital Employee 对本机 Host、服务凭证和员工包能力检查都通过的引擎才可选择。已有 GitHub Pages 档案请先导出，再在 Runtime 页面导入。" \
            --generate-notes \
            --draft
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
